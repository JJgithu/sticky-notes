<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quick Stickies</title>
<script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#1a1a2e;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}

#toolbar{
  position:fixed;top:0;left:0;right:0;height:54px;
  background:#16213e;display:flex;align-items:center;
  padding:0 14px;z-index:9999;border-bottom:1px solid #0f3460;
}
#toolbar .title{color:#FFF2AB;font-weight:bold;font-size:18px;margin-right:14px}
.tbtn{
  padding:7px 14px;margin:0 3px;border:none;border-radius:6px;
  color:#fff;font-size:14px;cursor:pointer;background:#333;
}
.tbtn.act{background:#0078D7}
.tbtn-add{background:#0078D7}
.sep{width:1px;height:28px;background:rgba(255,255,255,0.12);margin:0 8px}
.pdot{
  width:22px;height:22px;border-radius:11px;
  border:2px solid rgba(255,255,255,0.25);margin:0 2px;
  cursor:pointer;display:inline-block;
}
.pdot.sel{border-color:#fff}
.sz-btn{padding:5px 8px;margin:0 2px;border:none;border-radius:4px;color:#ccc;font-size:12px;cursor:pointer;background:#2a2a4a}
.alert-wrap{margin-left:auto;display:flex;align-items:center;color:#fff;font-size:13px;cursor:pointer}
.alert-wrap input{margin-right:5px;width:16px;height:16px;cursor:pointer}

#workspace{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden}

.note{position:absolute;border-radius:10px;overflow:visible;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
.note-hdr{
  height:34px;display:flex;align-items:center;padding:0 6px;
  cursor:move;background:rgba(0,0,0,0.06);border-radius:10px 10px 0 0;
}
.note-hdr .cdot{
  width:16px;height:16px;border-radius:8px;
  border:1px solid rgba(0,0,0,0.15);margin:0 2px;cursor:pointer;
  display:inline-block;
}
.note-del{
  margin-left:auto;width:24px;height:24px;text-align:center;
  line-height:24px;border-radius:12px;cursor:pointer;
  color:rgba(0,0,0,0.3);font-size:16px;background:rgba(0,0,0,0.06);
}
.note-canvas{position:absolute;top:34px;left:0;z-index:1;pointer-events:none}
.note-text{
  position:absolute;top:34px;left:0;right:0;bottom:0;
  padding:8px;border:none;background:transparent;
  font-size:16px;color:rgba(0,0,0,0.8);resize:none;outline:none;
  font-family:sans-serif;z-index:2;touch-action:auto;
}
.draw-active .note-canvas{z-index:3;pointer-events:auto}
.draw-active .note-text{pointer-events:none}

.resize-hdl{
  position:absolute;right:0;bottom:0;width:28px;height:28px;
  cursor:nwse-resize;z-index:10;
}
.resize-hdl:after{
  content:'';position:absolute;right:4px;bottom:4px;
  width:0;height:0;border-style:solid;
  border-width:0 0 10px 10px;
  border-color:transparent transparent rgba(0,0,0,0.2) transparent;
}
</style>
</head>
<body>

<div id="toolbar">
  <span class="title">Quick Stickies</span>
  <button class="tbtn tbtn-add" onclick="addNote();scheduleSave()">+ Note</button>
  <div class="sep"></div>
  <button class="tbtn mode-btn" id="btn-type" onclick="setMode('type')">Type</button>
  <button class="tbtn mode-btn act" id="btn-draw" onclick="setMode('draw')">Draw</button>
  <button class="tbtn mode-btn" id="btn-erase" onclick="setMode('erase')">Erase</button>
  <div class="sep"></div>
  <span class="pdot sel" data-pc="#000000" style="background:#000" onclick="pickPen(this)"></span>
  <span class="pdot" data-pc="#e74c3c" style="background:#e74c3c" onclick="pickPen(this)"></span>
  <span class="pdot" data-pc="#2ecc71" style="background:#2ecc71" onclick="pickPen(this)"></span>
  <span class="pdot" data-pc="#3498db" style="background:#3498db" onclick="pickPen(this)"></span>
  <span class="pdot" data-pc="#f39c12" style="background:#f39c12" onclick="pickPen(this)"></span>
  <span class="pdot" data-pc="#ffffff" style="background:#fff" onclick="pickPen(this)"></span>
  <div class="sep"></div>
  <button class="sz-btn" onclick="penSize=2">Thin</button>
  <button class="sz-btn" onclick="penSize=5">Med</button>
  <button class="sz-btn" onclick="penSize=10">Thick</button>
  <label class="alert-wrap"><input type="checkbox" id="alertChk" onchange="toggleAlert(this.checked)"> ALERT</label>
</div>

<div id="workspace"></div>

<script>
/* ── Quick Stickies — Strict ES5, no modern APIs ── */

window.onerror = function(msg, url, line) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:99999;padding:8px;font-size:14px';
  d.textContent = 'JS Error: ' + msg + ' [Line ' + line + ']';
  document.body.appendChild(d);
};

/* ── Globals ── */
var alexaClient = null;
function setDbg(txt) { /* debug bar removed */ }

var workspace = document.getElementById('workspace');
var noteCount = 0;
var zIdx = 100;
var currentMode = 'draw';   /* Draw mode is default */
var penColor = '#000000';
var penSize = 3;
var notesRestoredFromServer = false;

var NOTE_COLORS = ['#FFF2AB','#FFB3BA','#BAFFC9','#BAE1FF','#E0BBE4'];

/* ── Interaction state ── */
var dragNote = null, dragOffX = 0, dragOffY = 0;
var resizeNote = null, rsStartX = 0, rsStartY = 0, rsStartW = 0, rsStartH = 0;
var drawCvs = null, drawCtx = null, drawing = false;
var lastX = 0, lastY = 0, prevMidX = 0, prevMidY = 0;

/* ── Helpers ── */
function hasClass(el, c) {
  if (!el.className || typeof el.className !== 'string') return false;
  return (' ' + el.className + ' ').indexOf(' ' + c + ' ') !== -1;
}
function findUp(el, cls) {
  while (el && el !== document.body) { if (hasClass(el, cls)) return el; el = el.parentNode; }
  return null;
}
function inToolbar(el) {
  while (el && el !== document.body) { if (el.id === 'toolbar') return true; el = el.parentNode; }
  return false;
}

/* ── Toolbar actions ── */
function setMode(m) {
  currentMode = m;
  document.getElementById('btn-type').className = 'tbtn mode-btn' + (m === 'type' ? ' act' : '');
  document.getElementById('btn-draw').className = 'tbtn mode-btn' + (m === 'draw' ? ' act' : '');
  document.getElementById('btn-erase').className = 'tbtn mode-btn' + (m === 'erase' ? ' act' : '');
  var notes = workspace.querySelectorAll('.note');
  for (var i = 0; i < notes.length; i++) {
    var cn = notes[i].className.replace(' draw-active', '');
    if (m === 'draw' || m === 'erase') cn += ' draw-active';
    notes[i].className = cn;
  }
}

function pickPen(el) {
  penColor = el.getAttribute('data-pc');
  var dots = document.querySelectorAll('#toolbar .pdot');
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = dots[i] === el ? 'pdot sel' : 'pdot';
  }
}

/* ══════════════════════════════════════════════ */
/* ── Note creation                           ── */
/* ══════════════════════════════════════════════ */
var canvasUrlMap = {};  /* unused, kept for compat */

function addNote(data) {
  noteCount++;
  var noteId = (data && data.id) || ('n_' + Date.now() + '_' + Math.random().toString(36).substr(2,6));
  var w = (data && data.w) || 280;
  var h = (data && data.h) || 220;
  var col = (data && data.color) || NOTE_COLORS[(noteCount - 1) % NOTE_COLORS.length];
  var x = (data && data.x !== undefined) ? data.x : 20 + ((noteCount - 1) % 6) * 50;
  var y = (data && data.y !== undefined) ? data.y : 10 + (Math.floor((noteCount - 1) / 6) % 4) * 40;

  var n = document.createElement('div');
  n.className = 'note' + (currentMode !== 'type' ? ' draw-active' : '');
  n.setAttribute('data-color', col);
  n.setAttribute('data-id', noteId);
  n.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;background-color:' + col + ';z-index:' + (zIdx++);

  /* Header */
  var hdr = document.createElement('div');
  hdr.className = 'note-hdr';
  for (var c = 0; c < NOTE_COLORS.length; c++) {
    var dot = document.createElement('span');
    dot.className = 'cdot';
    dot.style.background = NOTE_COLORS[c];
    dot.setAttribute('data-color', NOTE_COLORS[c]);
    hdr.appendChild(dot);
  }
  var del = document.createElement('span');
  del.className = 'note-del';
  del.textContent = '\u2715';
  hdr.appendChild(del);
  n.appendChild(hdr);

  /* Canvas */
  var cH = h - 34;
  var cvs = document.createElement('canvas');
  cvs.className = 'note-canvas';
  cvs.width = w; cvs.height = cH;
  cvs.style.width = w + 'px'; cvs.style.height = cH + 'px';
  n.appendChild(cvs);

  /* Textarea */
  var ta = document.createElement('textarea');
  ta.className = 'note-text';
  ta.placeholder = 'Tap to type...';
  if (data && data.text) ta.value = data.text;
  ta.addEventListener('input', function() { scheduleSave(); }, false);
  n.appendChild(ta);

  /* Resize handle */
  var rh = document.createElement('div');
  rh.className = 'resize-hdl';
  n.appendChild(rh);

  workspace.appendChild(n);

  /* Restore canvas drawing from base64 data */
  if (data && data.canvasData) {
    var img = new Image();
    img.onload = function() {
      cvs.getContext('2d').drawImage(img, 0, 0);
    };
    img.src = data.canvasData;
  }

  return n;
}

/* ══════════════════════════════════════════════ */
/* ── Save notes to Lambda → S3 (debounced)  ── */
/* ══════════════════════════════════════════════ */
var saveTimer = null;

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function() { sendNotesToLambda(); }, 800);
}

/* ── Debounced canvas save (per note, 2s delay) ── */
var canvasTimers = {};

function scheduleCanvasSave(noteEl, canvasEl) {
  var nId = noteEl.getAttribute('data-id');
  if (!nId) return;
  if (canvasTimers[nId]) clearTimeout(canvasTimers[nId]);
  canvasTimers[nId] = setTimeout(function() {
    delete canvasTimers[nId];
    if (!alexaClient || !alexaClient.skill || !alexaClient.skill.sendMessage) return;
    try {
      var canvasData = canvasEl.toDataURL('image/png');
      alexaClient.skill.sendMessage({ type: 'saveCanvas', noteId: nId, data: canvasData });
    } catch(e) {
      /* canvas might be tainted or unavailable */
    }
  }, 2000);
}

function sendNotesToLambda() {
  if (!alexaClient || !alexaClient.skill || !alexaClient.skill.sendMessage) {
    setDbg('Cannot save: Alexa SDK not ready');
    return;
  }
  var notes = workspace.querySelectorAll('.note');
  var arr = [];
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    var ta = n.querySelector('.note-text');
    arr.push({
      id: n.getAttribute('data-id') || '',
      x: n.offsetLeft || 0,
      y: n.offsetTop || 0,
      w: n.offsetWidth,
      h: n.offsetHeight,
      color: n.getAttribute('data-color') || '#FFF2AB',
      text: ta ? ta.value : ''
    });
  }
  setDbg('Saving ' + arr.length + ' notes...');
  alexaClient.skill.sendMessage({ type: 'saveNotes', notes: arr });
}

/* ══════════════════════════════════════════════ */
/* ── Touch handlers                          ── */
/* ══════════════════════════════════════════════ */
function onStart(e) {
  var el = e.target;
  if (inToolbar(el)) return;
  var t = e.touches ? e.touches[0] : e;
  var note = findUp(el, 'note');
  if (!note) return;
  note.style.zIndex = zIdx++;

  if (hasClass(el, 'note-del')) {
    note.parentNode.removeChild(note);
    scheduleSave();
    e.preventDefault(); return;
  }
  if (hasClass(el, 'cdot') && findUp(el, 'note-hdr')) {
    var newCol = el.getAttribute('data-color');
    note.style.backgroundColor = newCol;
    note.setAttribute('data-color', newCol);
    scheduleSave();
    e.preventDefault(); return;
  }
  if (hasClass(el, 'resize-hdl')) {
    resizeNote = note;
    rsStartX = t.clientX; rsStartY = t.clientY;
    rsStartW = note.offsetWidth; rsStartH = note.offsetHeight;
    e.preventDefault(); return;
  }
  if (hasClass(el, 'note-hdr') || findUp(el, 'note-hdr')) {
    dragNote = note;
    dragOffX = t.clientX - note.offsetLeft;
    dragOffY = t.clientY - note.offsetTop;
    e.preventDefault(); return;
  }
  if ((currentMode === 'draw' || currentMode === 'erase') && el.tagName === 'CANVAS') {
    drawCvs = el; drawCtx = el.getContext('2d'); drawing = true;
    var r = el.getBoundingClientRect();
    lastX = t.clientX - r.left; lastY = t.clientY - r.top;
    prevMidX = lastX; prevMidY = lastY;
    e.preventDefault(); return;
  }
}

function onMove(e) {
  var t = e.touches ? e.touches[0] : e;
  if (resizeNote) {
    var nw = rsStartW + (t.clientX - rsStartX);
    var nh = rsStartH + (t.clientY - rsStartY);
    if (nw < 150) nw = 150; if (nh < 120) nh = 120;
    resizeNote.style.width = nw + 'px'; resizeNote.style.height = nh + 'px';
    var cvs = resizeNote.querySelector('.note-canvas');
    if (cvs) { cvs.style.width = nw + 'px'; cvs.style.height = (nh - 34) + 'px'; }
    e.preventDefault(); return;
  }
  if (dragNote) {
    dragNote.style.left = (t.clientX - dragOffX) + 'px';
    dragNote.style.top  = (t.clientY - dragOffY) + 'px';
    e.preventDefault(); return;
  }
  if (drawing && drawCtx) {
    var r = drawCvs.getBoundingClientRect();
    var x = t.clientX - r.left; var y = t.clientY - r.top;
    var mx = (lastX + x) / 2; var my = (lastY + y) / 2;
    drawCtx.beginPath();
    drawCtx.moveTo(prevMidX, prevMidY);
    drawCtx.quadraticCurveTo(lastX, lastY, mx, my);
    if (currentMode === 'erase') {
      drawCtx.globalCompositeOperation = 'destination-out'; drawCtx.lineWidth = penSize * 4;
    } else {
      drawCtx.globalCompositeOperation = 'source-over'; drawCtx.strokeStyle = penColor; drawCtx.lineWidth = penSize;
    }
    drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; drawCtx.stroke();
    prevMidX = mx; prevMidY = my; lastX = x; lastY = y;
    e.preventDefault(); return;
  }
}

function onEnd(e) {
  if (resizeNote) {
    var cvs = resizeNote.querySelector('.note-canvas');
    if (cvs) {
      var tmp = document.createElement('canvas');
      tmp.width = cvs.width; tmp.height = cvs.height;
      tmp.getContext('2d').drawImage(cvs, 0, 0);
      var w = resizeNote.offsetWidth; var h = resizeNote.offsetHeight - 34;
      cvs.width = w; cvs.height = h;
      cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
      cvs.getContext('2d').drawImage(tmp, 0, 0);
    }
  }
  /* Save after drag, resize, or draw */
  if (dragNote || resizeNote) { scheduleSave(); }

  /* Debounced canvas save — waits 2s after last stroke to capture all strokes */
  if (drawing && drawCvs) {
    scheduleSave();
    var canvasRef = drawCvs;
    var noteRef = findUp(drawCvs, 'note');
    if (noteRef) {
      scheduleCanvasSave(noteRef, canvasRef);
    }
  }
  dragNote = null; resizeNote = null;
  drawing = false; drawCvs = null; drawCtx = null;
}

document.addEventListener('touchstart', onStart, false);
document.addEventListener('touchmove',  onMove,  false);
document.addEventListener('touchend',   onEnd,   false);

var mouseDown = false;
document.addEventListener('mousedown', function(e) { mouseDown = true; e.touches = [e]; onStart(e); }, false);
document.addEventListener('mousemove', function(e) { if (!mouseDown) return; e.touches = [e]; onMove(e); }, false);
document.addEventListener('mouseup', function(e) { mouseDown = false; onEnd(e); }, false);

/* ── Alert toggle ── */
function toggleAlert(checked) {
  if (alexaClient && alexaClient.skill && alexaClient.skill.sendMessage) {
    setDbg('Sending alert=' + checked + '...');
    alexaClient.skill.sendMessage({ type: 'setAlert', value: checked });
  } else {
    setDbg('Cannot send: Alexa SDK not ready');
  }
}

/* ══════════════════════════════════════════════ */
/* ── Initialize Alexa SDK + restore notes    ── */
/* ══════════════════════════════════════════════ */
if (typeof Alexa !== 'undefined' && Alexa.create) {
  Alexa.create({version: '1.1'})
    .then(function(args) {
      alexaClient = args.alexa;
      var initData = args.message;

      /* Restore alert checkbox */
      if (initData && initData.alertOn) {
        var chk = document.getElementById('alertChk');
        if (chk) chk.checked = true;
      }

      /* Restore saved notes from Lambda/S3 */
      if (initData && initData.notes && initData.notes.length > 0) {
        while (workspace.firstChild) workspace.removeChild(workspace.firstChild);
        noteCount = 0;
        var canvasCount = 0;
        for (var i = 0; i < initData.notes.length; i++) {
          if (initData.notes[i].canvasData) canvasCount++;
          addNote(initData.notes[i]);
        }
        notesRestoredFromServer = true;
        setDbg('Restored ' + initData.notes.length + ' notes, ' + canvasCount + ' drawings');
      } else {
        setDbg('Alexa SDK: ready | No saved notes');
      }

      /* Listen for Lambda responses */
      alexaClient.skill.onMessage(function(msg) {
        if (msg.type === 'saveResult') {
          setDbg('Saved ' + msg.count + ' notes');
        } else if (msg.type === 'canvasSaved') {
          setDbg('Canvas saved: ' + msg.noteId);
        } else {
          setDbg('Lambda: ' + JSON.stringify(msg));
        }
      });
    })
    .catch(function(err) {
      setDbg('Alexa SDK error: ' + err);
    });
} else {
  setDbg('Browser mode (no server persistence)');
}

/* ── Boot: create one blank note (will be replaced if server has saved notes) ── */
addNote();
</script>
</body>
</html>
