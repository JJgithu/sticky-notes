<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticky Notes</title>
    <!-- Alexa Web API for Games -->
    <script src="https://cdn.amazon.com/alexa-web-app-api/2.1.0/alexa-web-app-api.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #0078D7; /* Windows Blue */
            --toolbar-height: 60px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrolling for a true app feel */
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Global Toolbar --- */
        #global-toolbar {
            height: var(--toolbar-height);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 1000;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active, .btn.active {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.4);
        }

        .btn-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .btn-primary:active {
            background: #005a9e;
        }

        .separator {
            width: 1px;
            height: 30px;
            background: var(--glass-border);
            margin: 0 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 15px;
        }

        .control-group label {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 600;
        }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--glass-border);
            border-radius: 50%;
        }

        input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        /* --- Workspace --- */
        #workspace {
            flex-grow: 1;
            position: relative;
            overflow: hidden; /* Notes stay inside */
        }

        /* --- Sticky Note Container --- */
        .sticky-note {
            position: absolute;
            width: 300px;
            height: 250px;
            background-color: #FFF2AB; /* Default Yellow */
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Allow resizing on all sides via CSS resize (bottom-right native, others custom later if needed) */
            resize: both;
            min-width: 200px;
            min-height: 150px;
        }

        .note-header {
            height: 40px;
            background: rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding: 0 10px;
            cursor: move; /* Indicate draggable */
        }

        .note-actions {
            margin-left: auto;
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: rgba(0,0,0,0.6);
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 4px;
        }

        .icon-btn:active {
            background: rgba(0,0,0,0.1);
            color: black;
        }

        /* --- Interactive Elements inside Notes --- */
        .type-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 10px;
            outline: none;
            border: none;
            background: transparent;
            font-size: 18px;
            font-family: 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
            color: rgba(0,0,0,0.8);
            resize: none;
            overflow-y: auto;
            z-index: 10;
        }

        /* Prevent typing interaction when drawing */
        body.mode-draw .type-layer,
        body.mode-erase .type-layer {
            pointer-events: none;
        }

        .draw-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Allow canvas interaction in draw/erase mode */
        body.mode-draw .draw-layer,
        body.mode-erase .draw-layer {
            pointer-events: auto;
            cursor: crosshair;
        }
    </style>
</head>
<body class="mode-type">

    <div id="global-toolbar">
        <button class="btn btn-primary" id="btn-add-note">+ New Note</button>
        <div class="separator"></div>
        <button class="btn active" id="btn-mode-type">Type</button>
        <button class="btn" id="btn-mode-draw">Draw</button>
        <button class="btn" id="btn-mode-erase">Erase</button>
        <div class="separator"></div>

        <div class="control-group" id="group-color">
            <label>Color</label>
            <input type="color" id="ink-color" value="#000000">
        </div>

        <div class="control-group" id="group-draw-size">
            <label>Pen Size</label>
            <input type="range" id="draw-size" min="1" max="20" value="3">
        </div>

        <div class="control-group" id="group-erase-size" style="display: none;">
            <label>Eraser Size</label>
            <input type="range" id="erase-size" min="10" max="100" value="30">
        </div>
    </div>

    <div id="workspace">
        <!-- Notes will be injected here -->
    </div>

    <script>
        // State
        let currentMode = 'type'; // 'type', 'draw', 'erase'
        let zIndexCounter = 100;

        // Elements
        const workspace = document.getElementById('workspace');
        const btnAddNote = document.getElementById('btn-add-note');
        
        const modeGroup = {
            'type': document.getElementById('btn-mode-type'),
            'draw': document.getElementById('btn-mode-draw'),
            'erase': document.getElementById('btn-mode-erase')
        };
        const groupDrawSize = document.getElementById('group-draw-size');
        const groupEraseSize = document.getElementById('group-erase-size');
        const groupColor = document.getElementById('group-color');

        // Mode Switching
        function setMode(mode) {
            currentMode = mode;
            document.body.className = `mode-${mode}`;
            
            // Update button styles
            Object.values(modeGroup).forEach(btn => btn.classList.remove('active'));
            modeGroup[mode].classList.add('active');

            // Toggle toolbar visibility
            if (mode === 'erase') {
                groupEraseSize.style.display = 'flex';
                groupDrawSize.style.display = 'none';
                groupColor.style.display = 'none';
            } else {
                groupEraseSize.style.display = 'none';
                groupDrawSize.style.display = 'flex';
                groupColor.style.display = 'flex';
            }
        }

        modeGroup['type'].onclick = () => setMode('type');
        modeGroup['draw'].onclick = () => setMode('draw');
        modeGroup['erase'].onclick = () => setMode('erase');

        // Note Creation
        function createStickyNote() {
            const note = document.createElement('div');
            note.className = 'sticky-note';
            note.style.zIndex = zIndexCounter++;
            note.style.left = '50px';
            note.style.top = '50px';

            note.innerHTML = `
                <div class="note-header">
                    <div class="note-actions">
                        <button class="icon-btn btn-delete">✕</button>
                    </div>
                </div>
                <div class="note-content">
                    <textarea class="type-layer" placeholder="Type a note..."></textarea>
                    <canvas class="draw-layer"></canvas>
                </div>
            `;

            // Bring to front on mousedown
            note.addEventListener('mousedown', () => {
                note.style.zIndex = zIndexCounter++;
            });

            // Delete Note
            note.querySelector('.btn-delete').onclick = () => {
                note.remove();
                syncNoteCount();
            };

            // Draggable Logic
            const header = note.querySelector('.note-header');
            let isDragging = false, startX, startY, startLeft, startTop;

            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseInt(note.style.left) || 0;
                startTop = parseInt(note.style.top) || 0;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                note.style.left = startLeft + dx + 'px';
                note.style.top = startTop + dy + 'px';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Canvas Drawing Logic
            const canvas = note.querySelector('.draw-layer');
            const ctx = canvas.getContext('2d');
            const contentDiv = note.querySelector('.note-content');
            
            // Resize Observer to keep canvas resolution crisp
            const resizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    // Save existing image
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(canvas, 0, 0);

                    // Resize
                    canvas.width = entry.contentRect.width;
                    canvas.height = entry.contentRect.height;
                    
                    // Setup context defaults
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    // Restore image
                    ctx.drawImage(tempCanvas, 0, 0);
                }
            });
            resizeObserver.observe(contentDiv);

            // Drawing State
            let isDrawing = false;
            let paths = [];

            function getPointerPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function startPosition(e) {
                if (currentMode === 'type') return; // Do not draw in type mode
                isDrawing = true;
                const pos = getPointerPos(e);
                paths = [pos];
                e.preventDefault(); // Prevent scrolling on touch
            }

            function endPosition() {
                isDrawing = false;
                ctx.beginPath(); // Reset the path
            }

            function draw(e) {
                if (!isDrawing) return;
                
                const pos = getPointerPos(e);
                paths.push(pos);

                ctx.lineWidth = currentMode === 'erase' ? document.getElementById('erase-size').value : document.getElementById('draw-size').value;
                ctx.strokeStyle = currentMode === 'erase' ? 'rgba(0,0,0,1)' : document.getElementById('ink-color').value;
                ctx.globalCompositeOperation = currentMode === 'erase' ? 'destination-out' : 'source-over';

                ctx.beginPath();
                if (paths.length < 3) {
                    const b = paths[0];
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    return;
                }

                ctx.moveTo(paths[0].x, paths[0].y);
                for (let i = 1; i < paths.length - 2; i++) {
                    const c = (paths[i].x + paths[i + 1].x) / 2;
                    const d = (paths[i].y + paths[i + 1].y) / 2;
                    ctx.quadraticCurveTo(paths[i].x, paths[i].y, c, d);
                }
                
                // For the last 2 points
                ctx.quadraticCurveTo(
                    paths[paths.length - 2].x,
                    paths[paths.length - 2].y,
                    paths[paths.length - 1].x,
                    paths[paths.length - 1].y
                );
                ctx.stroke();
                
                e.preventDefault();
            }

            // Mouse Events
            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseleave', endPosition);

            // Touch Events
            canvas.addEventListener('touchstart', startPosition, {passive: false});
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchcancel', endPosition);
            canvas.addEventListener('touchmove', draw, {passive: false});

            workspace.appendChild(note);
            syncNoteCount();
        }

        btnAddNote.onclick = createStickyNote;

        // Sync Data to Alexa Widget
        function syncNoteCount() {
            if (typeof alexa !== 'undefined' && alexa.skill) {
                const count = document.querySelectorAll('.sticky-note').length;
                console.log(`Syncing note count: ${count}`);
                alexa.skill.sendMessage({
                    action: 'syncData',
                    noteCount: count
                });
            }
        }

        // Initialize Alexa API
        try {
            alexa.create().then(() => {
                console.log("Alexa Web API initialized.");
                syncNoteCount(); // Initial sync
            });
        } catch (e) {
            console.error("Alexa init error: " + e);
        }

        // Create an initial note
        createStickyNote();
    </script>
</body>
</html>
